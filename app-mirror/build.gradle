plugins {
    id 'com.android.application'
    id 'dev.rikka.tools.refine'
}

def audioLoopbackAssetsDir = file("$buildDir/generated/audioLoopbackAssets")
def audioLoopbackHelper = file("$audioLoopbackAssetsDir/audio_loopback_helper_arm64")
def ndkHostTag = System.getProperty("os.name").toLowerCase().contains("mac")
        ? "darwin-x86_64"
        : "linux-x86_64"
def audioLoopbackCompiler = file("${android.sdkDirectory}/ndk/28.0.13004108/toolchains/llvm/prebuilt/${ndkHostTag}/bin/aarch64-linux-android27-clang++")

tasks.register("buildAudioLoopbackHelper", Exec) {
    inputs.file("src/main/cpp/audio_loopback_helper.cpp")
    inputs.file(audioLoopbackCompiler)
    outputs.file(audioLoopbackHelper)
    doFirst {
        audioLoopbackAssetsDir.mkdirs()
    }
    commandLine audioLoopbackCompiler,
            "-std=c++17", "-O2", "-fPIE", "-pie", "-static-libstdc++",
            "src/main/cpp/audio_loopback_helper.cpp", "-ldl", "-o", audioLoopbackHelper
}

android {
    namespace 'com.connect_screen.mirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartisanos.tntanywhere"
        minSdk 27
        targetSdk 34
        versionCode 112
        versionName "0.9.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            ndkVersion "28.0.13004108"
           abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir(audioLoopbackAssetsDir)
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn("buildAudioLoopbackHelper")
    }
}

dependencies {
    implementation project(':hidden-api-stub')
    
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation libs.androidx.window
    compileOnly project(':hidden-api-stub')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'dev.rikka.tools.refine:runtime:4.4.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'org.jmdns:jmdns:3.5.8'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2"
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.68'
    compileOnly files('libs/XposedBridgeApi-stub.jar')
}
